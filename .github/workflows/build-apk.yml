name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "android-sdk-license-1247695" > $ANDROID_HOME/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license

      - name: Build Debug APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cd android-project/app/build/outputs/apk/debug/
          if [ -f app-debug-arm64-v8a.apk ]; then
            mv app-debug-arm64-v8a.apk suno-downloader-debug.apk
          elif [ -f app-debug.apk ]; then
            mv app-debug.apk suno-downloader-debug.apk
          else
            ls -la
            echo "APK not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suno-downloader-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          retention-days: 7
